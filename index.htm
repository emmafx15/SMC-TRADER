<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMC TRADER - Register</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif}
body{min-height:100vh;background:#020a06;color:#fff;display:flex;justify-content:center;align-items:center;padding:16px;position:relative}
.bg{position:fixed;inset:0;background:linear-gradient(rgba(2,10,6,0.65), rgba(2,10,6,0.9)), url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=1920&q=80');background-size:cover;background-position:center;z-index:0}
.card{position:relative;z-index:10;width:400px;padding:28px;border-radius:24px;background:rgba(10,22,16,0.9);border:1px solid rgba(0,255,136,0.3);backdrop-filter:blur(22px)}
.label{font-size:12px;opacity:0.7;margin:10px 0 5px;display:block;font-weight:600}
.input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;outline:none}
.btn{width:100%;padding:13px;border-radius:12px;border:0;font-weight:900;cursor:pointer;margin-top:12px;font-size:14px}
.btn-green{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#000}
.btn-white{background:#fff;color:#000;display:flex;justify-content:center;align-items:center;gap:8px;font-weight:700}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0;font-size:11px;opacity:0.5}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.1)}
.msg{padding:10px 14px;border-radius:10px;font-size:12px;margin-bottom:12px;display:none}
.msg.ok{background:rgba(0,255,136,0.15);border:1px solid #00ff88;color:#00ff88;display:block}
.msg.err{background:rgba(255,68,68,0.15);border:1px solid #ff4444;color:#ff8888;display:block}
a{color:#00ff88;text-decoration:none;font-size:13px}
.step{font-size:10px;opacity:0.5;letter-spacing:1px;margin-bottom:6px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="card">
<div class="step">Step 1 of 4 • Email</div>
<h2 style="font-size:20px;font-weight:900">Create Account</h2>
<p style="font-size:12px;opacity:0.6;margin:4px 0 16px">Enter email or continue with Google</p>
<div id="msg" class="msg"></div>
<span class="label">Email Address</span><input class="input" id="email" placeholder="you@example.com">
<button class="btn btn-green" onclick="sendCode()">SEND CODE →</button>
<div class="divider">OR</div>
<button class="btn btn-white" onclick="googleSignUp()">
<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/></svg>
Sign up with Google
</button>
<div style="text-align:center;margin-top:14px"><a href="index.html">← Back</a> • <a href="login.html">Login</a></div>
</div>
<script>
function getUsers(){try{return JSON.parse(localStorage.getItem('smc_users')||'[]')}catch(e){return []}}
function showMsg(t,ok){const m=document.getElementById('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');}
function sendCode(){
 const email=document.getElementById('email').value.trim().toLowerCase();
 if(!email||!email.includes('@'))return showMsg('Enter valid email',false);
 if(getUsers().find(u=>u.email===email))return showMsg('Email already registered - Login',false);
 const code=Math.floor(100000+Math.random()*900000).toString();
 localStorage.setItem('smc_pending',JSON.stringify({email,code,verified:false,method:'email'}));
 showMsg('Code '+code+' generated! Redirecting...',true);
 setTimeout(()=>{window.location.href='verify.html';},1200);
}
function googleSignUp(){
 const e=prompt('Enter Google email:');
 if(!e||!e.includes('@'))return showMsg('Valid email',false);
 if(getUsers().find(u=>u.email===e.toLowerCase()))return showMsg('Already registered - Login',false);
 const code=Math.floor(100000+Math.random()*900000).toString();
 localStorage.setItem('smc_pending',JSON.stringify({email:e.toLowerCase(),code,verified:false,method:'google'}));
 showMsg('Google Code '+code+' - Redirecting...',true);
 setTimeout(()=>{window.location.href='verify.html';},1200);
}
</script>
</body>
                                                                </html>
