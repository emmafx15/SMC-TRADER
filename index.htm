<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMC TRADER - Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif}
body{min-height:100vh;background:#020a06;color:#fff;display:flex;justify-content:center;align-items:center;padding:20px;position:relative}
.bg{position:fixed;inset:0;background:linear-gradient(rgba(2,10,6,0.65), rgba(2,10,6,0.9)), url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=1920&q=80');background-size:cover;background-position:center;z-index:0}
.overlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%, rgba(0,255,136,0.22), transparent 60%);z-index:1}
.card{position:relative;z-index:10;width:420px;padding:36px 28px;border-radius:28px;background:rgba(10,22,16,0.9);border:1px solid rgba(0,255,136,0.3);backdrop-filter:blur(22px);text-align:center}
.logo-icon{width:60px;height:60px;background:linear-gradient(135deg,#00ff88,#00cc6a);border-radius:16px;display:flex;justify-content:center;align-items:center;font-weight:900;color:#000;font-size:22px;margin:0 auto 16px}
h1{font-size:28px;font-weight:900} .sub{font-size:11px;letter-spacing:2px;opacity:0.5;margin:8px 0 24px}
.btn{width:100%;padding:15px;border-radius:14px;border:0;font-weight:900;cursor:pointer;margin-top:12px;font-size:15px;display:block;text-decoration:none;text-align:center}
.btn-green{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#000;box-shadow:0 0 30px rgba(0,255,136,0.4)}
.btn-outline{background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.2)}
</style>
</head>
<body>
<div class="bg"></div><div class="overlay"></div>
<div class="card">
<div class="logo-icon">ST</div>
<h1>SMC TRADER</h1>
<div class="sub">PRECISION • LIQUIDITY • STRUCTURE</div>
<p style="font-size:13px;opacity:0.7;margin-bottom:20px">Professional SMC trading platform with live forex charts.</p>
<a href="register.html" class="btn btn-green">CREATE ACCOUNT →</a>
<a href="login.html" class="btn btn-outline">LOGIN</a>
</div>
<script>
const cur=localStorage.getItem('smc_current');
if(cur){ window.location.href='dashboard.html'; }
</script>
</body>
</html>
