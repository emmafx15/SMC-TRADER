<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMC TRADER - Correct Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,sans-serif}
body{min-height:100vh;background:#020a06;color:#fff;display:flex;justify-content:center;align-items:center;padding:16px;position:relative}
.bg{position:fixed;inset:0;background:
linear-gradient(rgba(2,10,6,0.65), rgba(2,10,6,0.9)),
url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?w=1920&q=80');
background-size:cover;background-position:center;z-index:0}
.overlay{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%, rgba(0,255,136,0.2), transparent 60%);z-index:1}
.card{position:relative;z-index:10;width:420px;padding:28px;border-radius:24px;background:rgba(10,22,16,0.9);border:1px solid rgba(0,255,136,0.3);backdrop-filter:blur(22px);box-shadow:0 20px 80px rgba(0,0,0,0.8)}
.logo{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#00ff88,#00cc6a);border-radius:10px;display:flex;justify-content:center;align-items:center;font-weight:900;color:#000;font-size:16px}
h1{font-size:22px;font-weight:900} .sub{font-size:10px;letter-spacing:1.5px;opacity:0.5;margin-bottom:18px}
.tabs{display:flex;background:rgba(0,0,0,0.5);padding:4px;border-radius:12px;border:1px solid rgba(255,255,255,0.08);margin-bottom:16px}
.tab{flex:1;padding:10px;border-radius:9px;border:0;background:transparent;color:#888;cursor:pointer;font-weight:800;font-size:13px}
.tab.active{background:#0a2e1a;color:#00ff88;border:1px solid rgba(0,255,136,0.3)}
.label{font-size:12px;opacity:0.7;margin:10px 0 5px;display:block;font-weight:600}
.input{width:100%;padding:12px 14px;border-radius:11px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;outline:none}
.btn{width:100%;padding:13px;border-radius:12px;border:0;font-weight:900;cursor:pointer;margin-top:12px;font-size:14px}
.btn-green{background:linear-gradient(135deg,#00ff88,#00cc6a);color:#000}
.btn-white{background:#fff;color:#000;display:flex;justify-content:center;align-items:center;gap:10px;font-weight:700}
.btn-gray{background:rgba(255,255,255,0.08);color:#fff;margin-top:8px}
.divider{display:flex;align-items:center;gap:12px;margin:16px 0;font-size:11px;opacity:0.5}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.1)}
.msg{padding:10px 14px;border-radius:10px;font-size:12px;margin-bottom:12px;display:none}
.msg.ok{background:rgba(0,255,136,0.15);border:1px solid #00ff88;color:#00ff88;display:block}
.msg.err{background:rgba(255,68,68,0.15);border:1px solid #ff4444;color:#ff8888;display:block}
.otp-box{display:flex;gap:7px;justify-content:center;margin:16px 0}
.otp{width:40px;height:50px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(0,0,0,0.4);color:#00ff88;font-size:20px;font-weight:900;text-align:center;outline:none}
.code-preview{background:rgba(0,255,136,0.12);border:1px dashed #00ff88;padding:10px;border-radius:12px;margin:12px 0;text-align:center}
.step{font-size:10px;opacity:0.5;margin-bottom:6px;letter-spacing:1px;text-transform:uppercase}
.phone-wrap{display:flex;gap:8px}
.phone-wrap select{width:95px;padding:12px 8px;border-radius:11px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#fff}
.dash{display:none;position:relative;z-index:2;width:100%;min-height:100vh;background:#050a0a}
.topbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:rgba(5,10,10,0.95);border-bottom:1px solid rgba(0,255,136,0.15)}
.content{padding:14px;display:grid;gap:14px;grid-template-columns:280px 1fr}
.port{background:linear-gradient(135deg, rgba(15,30,22,0.9), rgba(10,20,15,0.9));border:1px solid rgba(0,255,136,0.15);border-radius:18px;padding:16px}
.card-dash{background:#0f1e16;border:1px solid #1a3a2a;border-radius:14px;padding:14px}
.pair{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;margin:4px 0;border-radius:9px;background:rgba(20,30,25,0.6);border:1px solid transparent;cursor:pointer;font-size:13px}
.pair.on{background:rgba(0,255,136,0.12);border-color:#00ff88}
</style>
</head>
<body>
<div class="bg"></div><div class="overlay"></div>
<div style="position:relative;z-index:10;min-height:100vh;display:flex;justify-content:center;align-items:center;width:100%" id="authWrap">
<div class="card" id="authCard">
<div class="logo"><div class="logo-icon">ST</div><div><h1>SMC TRADER</h1><div class="sub">PRECISION • LIQUIDITY • STRUCTURE</div></div></div>
<div class="tabs" id="tabs"><button class="tab active" id="tLogin" onclick="switchTab('login')">Login</button><button class="tab" id="tReg" onclick="switchTab('reg')">Register</button></div>
<div id="message" class="msg"></div>

<div id="loginForm">
<span class="label">Email</span><input class="input" id="lEmail" placeholder="you@example.com">
<span class="label">Password</span><input class="input" id="lPass" type="password" placeholder="••••••••">
<button class="btn btn-green" onclick="doLogin()">LOGIN →</button>
<div class="divider">OR</div>
<button class="btn btn-white" onclick="googleSignIn('login')">
